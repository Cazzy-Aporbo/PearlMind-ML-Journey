name: A question, counterexample or broken experiment
description: Help make one idea clearer or one result more trustworthy.
body:
  - type: textarea
    id: question
    attributes:
      label: What were you trying to understand?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest input, command and observed output
      description: Include Python version and the file or lesson. Remove private data and credentials.
  - type: textarea
    id: expectation
    attributes:
      label: What did you expect, and why?
