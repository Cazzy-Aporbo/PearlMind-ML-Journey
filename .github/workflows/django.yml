name: Learning container
on:
  push:
    branches: [main]
    paths: [Dockerfile, .devcontainer/**, pyproject.toml, src/**, .github/workflows/django.yml]
  pull_request:
    paths: [Dockerfile, .devcontainer/**, pyproject.toml, src/**, .github/workflows/django.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pearlmind-learning .
      - run: docker run --rm pearlmind-learning python -c "from pearlmind.lessons.systems import gradient_demo; assert gradient_demo()['matches_full_batch']"
