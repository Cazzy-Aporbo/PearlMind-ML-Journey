<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">PearlMind · a learning room for consequential questions</title><desc id="desc">Iridescent orbital geometry connects observation, model, evidence and consequence on a midnight-blue field.</desc><defs><linearGradient id="g"><stop stop-color="#91eee0"/><stop offset=".5" stop-color="#beb5ff"/><stop offset="1" stop-color="#f2bccc"/></linearGradient><radialGradient id="p" cx=".3" cy=".2"><stop stop-color="#fff8e5"/><stop offset=".3" stop-color="#b4ecdf"/><stop offset=".68" stop-color="#9383bf"/><stop offset="1" stop-color="#192b47"/></radialGradient><radialGradient id="bg"><stop stop-color="#283557"/><stop offset="1" stop-color="#090f22"/></radialGradient></defs><rect width="1200" height="480" rx="28" fill="url(#bg)"/><g fill="none" stroke="url(#g)" opacity=".45"><ellipse cx="933" cy="225" rx="212" ry="108" transform="rotate(-32 933 225)"/><ellipse cx="933" cy="225" rx="174" ry="149" transform="rotate(34 933 225)"/><path d="M40 391 C300 370 450 440 670 360 S1000 340 1170 115"/></g><g fill="url(#p)"><circle cx="933" cy="225" r="102"/><circle cx="770" cy="275" r="16"/><circle cx="1063" cy="116" r="12"/><circle cx="1006" cy="363" r="9"/></g><g font-family="Arial,sans-serif"><text x="65" y="88" font-size="13" letter-spacing="4" fill="#a3dedb">CAZANDRA APORBO / OPEN LEARNING</text><text x="60" y="182" font-size="80" fill="url(#g)" font-family="Georgia,serif">PearlMind</text><text x="65" y="239" font-size="30" fill="#eeeaf6">Make a prediction.</text><text x="65" y="280" font-size="30" fill="#eeeaf6">Meet its consequences.</text><text x="65" y="336" font-size="16" fill="#b5bfd5">Small experiments. Visible reasoning. Room to be wrong.</text><text x="65" y="429" font-size="12" letter-spacing="3" fill="#b8c9dc">OBSERVE  →  MODEL  →  QUESTION  →  UNDERSTAND</text></g></svg>
